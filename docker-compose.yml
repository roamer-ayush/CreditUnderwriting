version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Service 1: FastAPI Credit Underwriting Service & Interactive Dashboard
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_underwriting_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=credit_user
      - DB_PASSWORD=credit_secure_pass
      - DB_NAME=credit_underwriting
      - ENVIRONMENT=production
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Service 2: MySQL 8.0 3NF Relational Database
  # Auto-executes database.sql on first startup to initialize 3NF tables
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: credit_underwriting_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass
      - MYSQL_DATABASE=credit_underwriting
      - MYSQL_USER=credit_user
      - MYSQL_PASSWORD=credit_secure_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "credit_user", "-pcredit_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
